<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0c1218">
  <title>Python Drop</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header>
    <div class="brand">PYTHON <b>DROP</b><small>Costruisci il codice un blocco alla volta.</small></div>
    <a class="switch" href="../">JSON →</a>
  </header>
  <div class="toolbar">
    <label class="button" for="file">Apri .py</label><input id="file" type="file" accept=".py,text/x-python">
    <button id="add" class="primary">+ Blocco</button>
    <button id="export">Esporta .py</button>
    <button id="code-toggle">Codice</button>
  </div>
  <main>
    <nav id="trail" aria-label="Percorso"></nav>
    <p id="status" role="status" aria-live="polite">Caricamento del motore Python…</p>
    <section id="blocks" aria-label="Blocchi Python"></section>
  </main>
  <dialog id="create">
    <form method="dialog" id="create-form">
      <h2>Nuovo blocco</h2>
      <label>Tipo<select id="kind">
        <option value="variable">Variabile</option><option value="function">Funzione</option>
        <option value="if">Se</option><option value="for">Per ogni</option>
        <option value="while">Finché</option><option value="class">Classe</option>
        <option value="import">Import</option><option value="return">Ritorna</option>
      </select></label>
      <label id="name-row">Nome<input id="name" value="elemento" autocapitalize="off" spellcheck="false"></label>
      <div id="value-row">
        <label>Valore<select id="value-kind"><option value="number">Numero</option><option value="text">Testo</option><option value="variable">Variabile</option></select></label>
        <label>Contenuto<input id="value" value="0" autocapitalize="off" spellcheck="false"></label>
      </div>
      <label id="count-row" hidden>Ripetizioni<input id="count" type="number" min="0" max="100000" value="3"></label>
      <div class="dialog-actions"><button value="cancel">Annulla</button><button id="create-submit" value="create" class="primary">Aggiungi</button></div>
    </form>
  </dialog>
  <dialog id="code-sheet">
    <div class="sheet-top"><h2>Codice Python</h2><button id="close-code" aria-label="Chiudi">✕</button></div>
    <textarea id="code" readonly spellcheck="false" aria-label="Codice Python generato"></textarea>
  </dialog>
</body>
</html>
