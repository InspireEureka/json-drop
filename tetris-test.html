<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JSON Drop · Tetris Test</title>
<style>
:root{color-scheme:dark;--bg:#0b0c0f;--panel:#151820;--card:#20242e;--line:#596170;--text:#ffffff;--muted:#b8bec9;--accent:#9db2ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,sans-serif;overscroll-behavior:none}
main{max-width:620px;margin:auto;padding:18px 14px 80px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.top b{font-size:18px}.top small{display:block;color:var(--muted);margin-top:3px}
button{font:inherit;color:inherit}.add{min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:0 14px}
.palette{display:flex;gap:8px;overflow:auto;padding-bottom:12px}.piece{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 14px}
.board{position:relative;border:1px solid var(--line);border-radius:18px;background:var(--panel);padding:12px;min-height:380px}
.hint{color:var(--muted);font-size:12px;margin:0 0 10px 3px}
.slot{min-height:62px;border:1px dashed var(--line);border-radius:13px;margin:8px 0;display:flex;align-items:center;padding:7px;transition:.15s}.slot[data-depth="1"]{margin-left:34px}.slot[data-depth="2"]{margin-left:68px}.slot.hot{border-color:var(--accent);background:#8ea6ff12}
.node{width:100%;min-height:46px;border:1px solid #687181;border-radius:10px;background:var(--card);display:flex;align-items:center;gap:8px;padding:7px 9px;touch-action:none;user-select:none;-webkit-user-select:none}.grip{color:var(--muted);font-size:18px}.node input{min-width:0;flex:1;border:0;outline:0;background:transparent;color:var(--text);font-size:16px}.type{font:700 9px ui-monospace,monospace;color:var(--muted);letter-spacing:.08em}
.node.dragging{position:fixed;z-index:99;width:min(360px,78vw);pointer-events:none;opacity:.94;box-shadow:0 14px 40px #0008;transform:scale(1.02)}
.empty{color:#9ba3b0;font-size:11px;margin:auto}.foot{color:var(--muted);font-size:11px;margin-top:12px;text-align:center}
</style>
</head>
<body><main>
<div class="top"><div><b>Tetris Test</b><small>Tap crea · tieni e trascina · scrivi</small></div><button class="add" id="reset">Reset</button></div>
<div class="palette">
<button class="piece" data-type="OBJECT">+ Object</button>
<button class="piece" data-type="LIST">+ List</button>
<button class="piece" data-type="TEXT">+ Text</button>
</div>
<div class="board" id="board">
<p class="hint">La posizione orizzontale rappresenta la profondità.</p>
<div class="slot" data-depth="0"><span class="empty">ROOT</span></div>
<div class="slot" data-depth="1"><span class="empty">CHILD</span></div>
<div class="slot" data-depth="2"><span class="empty">CHILD²</span></div>
<div class="slot" data-depth="0"><span class="empty">ROOT</span></div>
<div class="slot" data-depth="1"><span class="empty">CHILD</span></div>
</div>
<div class="foot">Esperimento isolato. Non modifica JSON Drop V0.</div>
</main>
<script>
const board=document.querySelector('#board'), slots=[...document.querySelectorAll('.slot')];let seq=0,drag=null,offX=0,offY=0,home=null;
function placeholder(s){if(!s.querySelector('.node')&&!s.querySelector('.empty')){let e=document.createElement('span');e.className='empty';e.textContent=['ROOT','CHILD','CHILD²'][+s.dataset.depth]||'SLOT';s.append(e)}}
function make(type){const n=document.createElement('div');n.className='node';n.innerHTML='<span class="grip">≡</span><span class="type">'+type+'</span><input aria-label="Valore" placeholder="scrivi qui…">';n.querySelector('input').addEventListener('pointerdown',e=>e.stopPropagation());n.addEventListener('pointerdown',start);return n}
function put(n,s){s.querySelector('.empty')?.remove();s.append(n)}
document.querySelectorAll('.piece').forEach(b=>b.addEventListener('click',()=>{let target=slots.find(s=>!s.querySelector('.node'));if(target){put(make(b.dataset.type),target);target.querySelector('input').focus()}}));
function start(e){if(e.target.closest('input'))return;drag=e.currentTarget;home=drag.parentElement;const r=drag.getBoundingClientRect();offX=e.clientX-r.left;offY=e.clientY-r.top;drag.style.left=r.left+'px';drag.style.top=r.top+'px';drag.classList.add('dragging');drag.setPointerCapture(e.pointerId);drag.addEventListener('pointermove',move);drag.addEventListener('pointerup',end,{once:true});e.preventDefault()}
function move(e){if(!drag)return;drag.style.left=(e.clientX-offX)+'px';drag.style.top=(e.clientY-offY)+'px';slots.forEach(s=>s.classList.remove('hot'));let el=document.elementFromPoint(e.clientX,e.clientY);let s=el?.closest('.slot');if(s&&(!s.querySelector('.node')||s===home))s.classList.add('hot')}
function end(e){if(!drag)return;let el=document.elementFromPoint(e.clientX,e.clientY),target=el?.closest('.slot');drag.classList.remove('dragging');drag.style.left='';drag.style.top='';drag.removeEventListener('pointermove',move);slots.forEach(s=>s.classList.remove('hot'));if(target&&(!target.querySelector('.node')||target===home)){let old=home;put(drag,target);placeholder(old)}else put(drag,home);drag=null;home=null}
document.querySelector('#reset').addEventListener('click',()=>{slots.forEach(s=>{s.innerHTML='';placeholder(s)})});
</script></body></html>
