<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JSON Drop · Live JSON</title>
<style>
:root{
  color-scheme:dark;
  --bg:#0b0c0f;
  --panel:#151820;
  --line:#343b47;
  --text:#eef2f7;
  --muted:#8d96a5;
  --green:#65ff8f;
  --accent:#9db2ff;
  --danger:#ff7f87;
  --json-key:#9cdcfe;
  --json-string:#ce9178;
  --json-number:#b5cea8;
  --json-boolean:#569cd6;
  --json-null:#569cd6;
  --json-code:#d4d4d4;
  --indent:18px;
}
*{box-sizing:border-box}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font:17px system-ui,-apple-system,sans-serif;
  min-height:100vh;
}
main{
  max-width:720px;
  margin:auto;
  padding:18px 12px 80px;
}
.top{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:14px;
}
.top b{font-size:20px;margin-right:auto}
.top button{
  width:44px;
  height:44px;
  min-height:44px;
  border:1px solid #404958;
  border-radius:12px;
  background:#1b2029;
  color:var(--text);
  padding:0;
  display:grid;
  place-items:center;
  transition:transform .06s ease,background .06s ease,border-color .06s ease;
}
.top button svg{
  width:20px;
  height:20px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.9;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.top button:active{transform:scale(.96);background:#272e39;border-color:#596577}
.top .clear{color:var(--danger)}
.editor{
  padding:4px 0 16px;
  overflow-x:auto;
}
.line{
  min-height:42px;
  display:flex;
  align-items:center;
  gap:4px;
  padding-right:8px;
  white-space:nowrap;
  font:20px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
.line:hover{background:#ffffff05}
.line:focus-within{background:#ffffff07}
.code{color:var(--json-code)}
.key{
  color:var(--json-key);
  min-width:1ch;
  border-radius:5px;
  outline:none;
}
.string{
  color:var(--json-string);
  min-width:1ch;
  border-radius:5px;
  outline:none;
}
.number{color:var(--json-number)}
.boolean{color:var(--json-boolean)}
.null{color:var(--json-null)}
.editable{
  padding:4px 3px;
  border-radius:6px;
  border-bottom:1px solid transparent;
  cursor:text;
  caret-color:var(--json-key);
  -webkit-user-select:text;
  user-select:text;
  touch-action:manipulation;
}
.editable:focus{
  background:#ffffff0a;
  border-bottom-color:currentColor;
  box-shadow:inset 0 0 0 1px #ffffff12;
}
.invalid{
  color:var(--danger)!important;
  border-bottom-color:var(--danger)!important;
}
.delete{
  margin-left:auto;
  width:40px;
  height:40px;
  flex:0 0 40px;
  border:1px solid transparent;
  border-radius:11px;
  background:#171b22;
  color:#7d8795;
  font-size:22px;
  line-height:1;
  transition:transform .06s ease,background .06s ease,color .06s ease;
}
.delete:active{transform:scale(.92);color:var(--danger);background:#ff7f8718}
.delete:hover{color:var(--danger);background:#ff7f8710}
.add-line{
  min-height:48px;
  display:flex;
  align-items:center;
  padding-right:8px;
}
.add-btn{
  min-height:42px;
  border:1px solid #36404d;
  border-radius:11px;
  background:#161b22;
  color:#aeb7c4;
  font:600 14px system-ui,-apple-system,sans-serif;
  padding:0 13px;
  transition:transform .06s ease,background .06s ease,border-color .06s ease,color .06s ease;
}
.add-btn:active{transform:scale(.97);background:#1f2a24;border-color:var(--green);color:var(--green)}
.add-btn:hover{border-color:#536071;color:var(--text)}
.type-menu{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  padding:6px 8px 10px 0;
}
.type-menu button{
  min-height:44px;
  border:1px solid #424c5a;
  border-radius:12px;
  background:#1a2029;
  color:#d2d8e1;
  padding:0 13px 0 9px;
  font:600 14px system-ui,-apple-system,sans-serif;
  display:inline-flex;
  align-items:center;
  gap:8px;
  transition:transform .06s ease,background .06s ease,border-color .06s ease,color .06s ease;
}
.type-icon{
  width:28px;
  height:28px;
  flex:0 0 28px;
  display:grid;
  place-items:center;
  border-radius:8px;
  background:#0f1319;
  border:1px solid #343d49;
  font:700 13px ui-monospace,SFMono-Regular,Menlo,monospace;
}
.type-icon.string,.type-label.string{color:var(--json-string)}
.type-icon.number,.type-label.number{color:var(--json-number)}
.type-icon.boolean,.type-label.boolean{color:var(--json-boolean)}
.type-icon.null,.type-label.null{color:var(--json-null)}
.type-icon.object,.type-label.object{color:var(--json-key)}
.type-icon.array,.type-label.array{color:#c586c0}
.type-menu button:active{
  transform:scale(.95);
  border-color:var(--green);
  background:#1c2b22;
  color:var(--green);
}
.type-menu button:hover{
  border-color:#5b6878;
  color:#fff;
}
.hint{
  margin:14px 2px 0;
  color:var(--muted);
  font-size:13px;
  text-align:center;
}
.toast{
  position:fixed;
  left:50%;
  bottom:22px;
  transform:translateX(-50%) translateY(10px);
  background:#222832;
  border:1px solid var(--line);
  color:var(--text);
  border-radius:999px;
  padding:9px 14px;
  opacity:0;
  pointer-events:none;
  transition:.1s ease;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:520px){
  main{padding:14px 8px 72px}
  .top{gap:6px;margin-bottom:12px}
  .top b{font-size:19px}
  .top button{width:44px;height:44px;min-height:44px;padding:0}
  :root{--indent:16px}
  .line{min-height:46px;font-size:20px}
  .type-menu button{min-height:46px;font-size:14px}
  .add-btn{min-height:44px;font-size:15px}
}
</style>
</head>
<body>
<main>
  <div class="top">
    <b>JSON Drop</b>
    <button id="copy" aria-label="Copia JSON" title="Copia JSON">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="11" height="11" rx="2"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg>
    </button>
    <button id="download" aria-label="Scarica JSON" title="Scarica JSON">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M5 21h14"></path></svg>
    </button>
    <button class="clear" id="clear" aria-label="Svuota JSON" title="Svuota JSON">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"></path><path d="M9 7V4h6v3"></path><path d="m7 7 1 13h8l1-13"></path><path d="M10 11v5M14 11v5"></path></svg>
    </button>
  </div>
  <div class="editor" id="editor" aria-label="Editor JSON visuale"></div>
</main>
<div class="toast" id="toast"></div>

<script>
const editor=document.querySelector('#editor');
const toast=document.querySelector('#toast');
let nextId=1;
let openAdder=null;
let focusAfterRender=null;

const node=(type,value)=>({id:nextId++,type,value});
const root={id:0,type:'object',children:[]};

function primitive(type){
  if(type==='string')return node('string','value');
  if(type==='number')return node('number','0');
  if(type==='boolean')return node('boolean','true');
  if(type==='null')return node('null',null);
  if(type==='object')return {id:nextId++,type:'object',children:[]};
  if(type==='array')return {id:nextId++,type:'array',children:[]};
}

function property(type){
  return {id:nextId++,kind:'property',key:'key',value:primitive(type)};
}

function esc(s){return JSON.stringify(String(s))}

function valueToJSON(v,depth){
  if(v.type==='string')return esc(v.value);
  if(v.type==='number')return String(v.value);
  if(v.type==='boolean')return String(v.value);
  if(v.type==='null')return 'null';

  const pad='  '.repeat(depth);
  const inner='  '.repeat(depth+1);

  if(v.type==='object'){
    if(!v.children.length)return '{}';
    return '{\\n'+v.children.map(p=>inner+esc(p.key)+': '+valueToJSON(p.value,depth+1)).join(',\\n')+'\\n'+pad+'}';
  }

  if(v.type==='array'){
    if(!v.children.length)return '[]';
    return '[\\n'+v.children.map(i=>inner+valueToJSON(i,depth+1)).join(',\\n')+'\\n'+pad+']';
  }
}

function jsonText(){
  return valueToJSON(root,0);
}

function findContainer(id,n=root){
  if(n.id===id&&(n.type==='object'||n.type==='array'))return n;
  if(n.type==='object'){
    for(const p of n.children){
      const r=findContainer(id,p.value);
      if(r)return r;
    }
  }
  if(n.type==='array'){
    for(const i of n.children){
      const r=findContainer(id,i);
      if(r)return r;
    }
  }
  return null;
}

function findProperty(id,n=root){
  if(n.type==='object'){
    for(const p of n.children){
      if(p.id===id)return p;
      const r=findProperty(id,p.value);
      if(r)return r;
    }
  }
  if(n.type==='array'){
    for(const i of n.children){
      const r=findProperty(id,i);
      if(r)return r;
    }
  }
  return null;
}

function findNode(id,n=root){
  if(n.id===id)return n;
  if(n.type==='object'){
    for(const p of n.children){
      if(p.value.id===id)return p.value;
      const r=findNode(id,p.value);
      if(r)return r;
    }
  }
  if(n.type==='array'){
    for(const i of n.children){
      if(i.id===id)return i;
      const r=findNode(id,i);
      if(r)return r;
    }
  }
  return null;
}

function removeById(id,n=root){
  if(n.type==='object'){
    const idx=n.children.findIndex(p=>p.id===id);
    if(idx>=0){n.children.splice(idx,1);return true}
    for(const p of n.children)if(removeById(id,p.value))return true;
  }
  if(n.type==='array'){
    const idx=n.children.findIndex(i=>i.id===id);
    if(idx>=0){n.children.splice(idx,1);return true}
    for(const i of n.children)if(removeById(id,i))return true;
  }
  return false;
}

function line(depth,html){
  return '<div class="line" style="padding-left:calc(10px + '+depth+' * var(--indent))">'+html+'</div>';
}

function renderPrimitive(v,depth,prefix,suffix,deleteId){
  let valueHtml='';
  if(v.type==='string'){
    valueHtml='<span class="code">&quot;</span><span class="string editable" contenteditable="true" spellcheck="false" data-edit-value="'+v.id+'">'+escapeHTML(v.value)+'</span><span class="code">&quot;</span>';
  }else if(v.type==='number'){
    valueHtml='<span class="number editable" contenteditable="true" spellcheck="false" data-edit-value="'+v.id+'">'+escapeHTML(v.value)+'</span>';
  }else if(v.type==='boolean'){
    valueHtml='<span class="boolean editable" contenteditable="true" spellcheck="false" data-edit-value="'+v.id+'">'+escapeHTML(v.value)+'</span>';
  }else{
    valueHtml='<span class="null">null</span>';
  }
  return line(depth,prefix+valueHtml+suffix+'<button class="delete" data-delete="'+deleteId+'" aria-label="Elimina">×</button>');
}

function renderValue(v,depth,prefix,suffix,deleteId){
  if(!['object','array'].includes(v.type)){
    return renderPrimitive(v,depth,prefix,suffix,deleteId);
  }

  const open=v.type==='object'?'{':'[';
  const close=v.type==='object'?'}':']';
  let html=line(depth,prefix+'<span class="code">'+open+'</span><button class="delete" data-delete="'+deleteId+'" aria-label="Elimina">×</button>');

  const children=v.children;
  children.forEach((child,index)=>{
    const comma=index<children.length-1?',':'';
    if(v.type==='object'){
      const key='<span class="code">&quot;</span><span class="key editable" contenteditable="true" spellcheck="false" data-edit-key="'+child.id+'">'+escapeHTML(child.key)+'</span><span class="code">&quot;: </span>';
      html+=renderValue(child.value,depth+1,key,comma,child.id);
    }else{
      html+=renderValue(child,depth+1,'',comma,child.id);
    }
  });

  html+=renderAdder(v,depth+1);
  html+=line(depth,'<span class="code">'+close+suffix+'</span>');
  return html;
}

function renderAdder(container,depth){
  const label=container.type==='object'?'+ Property':'+ Item';
  let html='<div class="add-line" style="padding-left:calc(10px + '+depth+' * var(--indent))"><button class="add-btn" data-add="'+container.id+'">'+label+'</button></div>';

  if(openAdder===container.id){
    html+='<div class="type-menu" style="padding-left:calc(10px + '+depth+' * var(--indent))">';
    const types={
      string:{label:'String',icon:'"'},
      number:{label:'Number',icon:'#'},
      boolean:{label:'Boolean',icon:'◐'},
      null:{label:'Null',icon:'∅'},
      object:{label:'Object',icon:'{}'},
      array:{label:'Array',icon:'[]'}
    };
    ['string','number','boolean','null','object','array'].forEach(t=>{
      const x=types[t];
      html+='<button data-type="'+t+'" data-parent="'+container.id+'"><span class="type-icon '+t+'" aria-hidden="true">'+x.icon+'</span><span class="type-label '+t+'">'+x.label+'</span></button>';
    });
    html+='</div>';
  }
  return html;
}

function escapeHTML(s){
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render(){
  let html=line(0,'<span class="code">{</span>');
  root.children.forEach((p,index)=>{
    const comma=index<root.children.length-1?',':'';
    const key='<span class="code">&quot;</span><span class="key editable" contenteditable="true" spellcheck="false" data-edit-key="'+p.id+'">'+escapeHTML(p.key)+'</span><span class="code">&quot;: </span>';
    html+=renderValue(p.value,1,key,comma,p.id);
  });
  html+=renderAdder(root,1);
  html+=line(0,'<span class="code">}</span>');
  editor.innerHTML=html;
  bindEditor();

  if(focusAfterRender){
    const el=editor.querySelector(focusAfterRender);
    focusAfterRender=null;
    if(el){
      el.focus();
      const range=document.createRange();
      range.selectNodeContents(el);
      const sel=getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }
  }
}

function bindEditor(){
  editor.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{
    const id=Number(b.dataset.add);
    openAdder=openAdder===id?null:id;
    render();
  });

  editor.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{
    const parent=findContainer(Number(b.dataset.parent));
    if(!parent)return;

    if(parent.type==='object'){
      const p=property(b.dataset.type);
      parent.children.push(p);
      focusAfterRender='[data-edit-key="'+p.id+'"]';
    }else{
      const v=primitive(b.dataset.type);
      parent.children.push(v);
      if(['string','number','boolean'].includes(v.type)){
        focusAfterRender='[data-edit-value="'+v.id+'"]';
      }
    }

    openAdder=null;
    render();
  });

  editor.querySelectorAll('[data-delete]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    removeById(Number(b.dataset.delete));
    render();
  });

  editor.querySelectorAll('[data-edit-key]').forEach(el=>{
    const p=findProperty(Number(el.dataset.editKey));
    if(!p)return;
    const old=p.key;

    const commitKey=()=>{
      const v=el.textContent.trim();
      p.key=v||old;
      if(!v){render();return false}
      return true;
    };

    el.onkeydown=e=>{
      if(e.key==='Enter'){
        e.preventDefault();
        if(!commitKey())return;
        if(['string','number','boolean'].includes(p.value.type)){
          const next=editor.querySelector('[data-edit-value="'+p.value.id+'"]');
          if(next){
            next.focus();
            const range=document.createRange();
            range.selectNodeContents(next);
            const sel=getSelection();
            sel.removeAllRanges();
            sel.addRange(range);
          }
        }else{
          el.blur();
        }
      }
      if(e.key==='Escape'){e.preventDefault();el.textContent=old;el.blur()}
    };

    el.onblur=()=>{commitKey()};
  });

  editor.querySelectorAll('[data-edit-value]').forEach(el=>{
    const v=findNode(Number(el.dataset.editValue));
    if(!v)return;
    const old=v.value;

    el.onkeydown=e=>{
      if(e.key==='Enter'){e.preventDefault();el.blur()}
      if(e.key==='Escape'){e.preventDefault();el.textContent=old;el.blur()}
    };

    el.oninput=()=>{
      if(v.type==='number'){
        el.classList.toggle('invalid',!validNumber(el.textContent));
      }else if(v.type==='boolean'){
        const t=el.textContent.trim();
        el.classList.toggle('invalid',t!=='true'&&t!=='false');
      }
    };

    el.onblur=()=>{
      const raw=el.textContent;
      if(v.type==='string'){
        v.value=raw;
        return;
      }
      if(v.type==='number'){
        const t=raw.trim();
        if(validNumber(t))v.value=t;
        else{v.value=old;render()}
        return;
      }
      if(v.type==='boolean'){
        const t=raw.trim();
        if(t==='true'||t==='false')v.value=t;
        else{v.value=old;render()}
      }
    };
  });
}

function validNumber(s){
  return /^-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+-]?\d+)?$/.test(String(s).trim());
}

function flash(msg){
  toast.textContent=msg;
  toast.classList.add('show');
  clearTimeout(flash.t);
  flash.t=setTimeout(()=>toast.classList.remove('show'),1200);
}

document.querySelector('#clear').onclick=()=>{
  root.children.length=0;
  openAdder=null;
  render();
  flash('ROOT svuotato');
};

document.querySelector('#copy').onclick=async()=>{
  const text=jsonText();
  try{
    await navigator.clipboard.writeText(text);
  }catch{
    const ta=document.createElement('textarea');
    ta.value=text;
    document.body.append(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
  }
  flash('JSON copiato');
};

document.querySelector('#download').onclick=()=>{
  const blob=new Blob([jsonText()+'\\n'],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='data.json';
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
};

document.body.addEventListener('touchstart',()=>{}, {passive:true});
render();
</script>
</body>
</html>
