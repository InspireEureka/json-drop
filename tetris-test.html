<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>JSON Drop · Touch Tree</title>
<style>
:root{color-scheme:dark;--bg:#0b0c0f;--panel:#151820;--card:#20242e;--line:#596170;--text:#fff;--muted:#aeb5c1;--green:#65ff8f;--accent:#9db2ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,sans-serif;overscroll-behavior:none}main{max-width:620px;margin:auto;padding:18px 14px 80px}
.top b{font-size:18px}.top small{display:block;color:var(--muted);margin:3px 0 14px}.add{min-height:48px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:13px;padding:0 16px;font:inherit;margin-bottom:12px}
.object{margin:5px 0}.card{height:54px;border:1px solid var(--line);border-radius:12px;background:var(--card);display:flex;align-items:center;gap:9px;padding:0 11px;touch-action:none;user-select:none;-webkit-user-select:none}
.toggle{width:34px;height:44px;border:0;background:transparent;color:var(--muted);font-size:18px}.icon{width:30px;height:30px;border:1px solid var(--green);border-radius:7px;display:grid;place-items:center;color:var(--green);font:700 12px ui-monospace,monospace}.name{flex:1;min-width:0;color:var(--green);font:700 16px system-ui;padding:10px 4px}.rename{position:fixed;inset:0;background:#0009;z-index:200;display:grid;place-items:center;padding:24px}.rename-box{width:min(420px,100%);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}.rename-box input{width:100%;height:52px;border:1px solid var(--green);border-radius:10px;background:var(--panel);color:var(--green);font:700 18px system-ui;padding:0 12px;outline:0}.brace{color:var(--muted);font:700 16px ui-monospace,monospace}
.children{margin-left:25px;padding-left:10px;border-left:1px solid #39404c;min-height:4px}.object.collapsed>.children{display:none}.root>.card{background:#252a35}.root>.children{margin-left:17px}
.object.dragging{position:fixed;z-index:100;width:min(480px,88vw);pointer-events:none;opacity:.92;filter:drop-shadow(0 16px 25px #000a)}.object.dragging>.children{display:none}
.dropzone{height:64px;margin:7px 0;border:2px dashed var(--accent);border-radius:13px;display:flex;align-items:center;justify-content:center;color:var(--accent);font:700 11px system-ui;letter-spacing:.04em;background:#9db2ff0d}.dropzone.inside{margin-left:25px}.dropzone.hot{background:#9db2ff24;transform:scale(.99)}
.note{text-align:center;color:var(--muted);font-size:11px;margin-top:12px}
</style></head><body><main>
<div class="top"><b>JSON Drop</b><small>Swipe a sinistra = rinomina · tieni e trascina la card = sposta</small></div>
<button class="add" id="add">+ Object {}</button>
<section class="object root" id="root"><div class="card"><button class="toggle">▾</button><span class="icon">{}</span><span class="name">ROOT</span><span class="brace">{</span></div><div class="children"></div></section>
<div class="note">Durante il drag compaiono bersagli grandi.</div>
</main><script>
const root=document.querySelector('#root');let seq=0,drag=null,origin=null,timer=null,sx=0,sy=0,dx=0,dy=0,armed=false,current=null;
function make(){const o=document.createElement('section');o.className='object';o.innerHTML='<div class="card"><button class="toggle">▾</button><span class="icon">{}</span><span class="name">Object '+(++seq)+'</span><span class="brace">{</span></div><div class="children"></div>';const card=o.querySelector('.card'),name=o.querySelector('.name'),tog=o.querySelector('.toggle');tog.addEventListener('pointerdown',e=>e.stopPropagation());tog.onclick=()=>{o.classList.toggle('collapsed');tog.textContent=o.classList.contains('collapsed')?'▸':'▾'};card.addEventListener('pointerdown',press);return o}
document.querySelector('#add').onclick=()=>{const o=make();root.querySelector(':scope>.children').append(o)}
function zones(){document.querySelectorAll('.dropzone').forEach(z=>z.remove());document.querySelectorAll('.object:not(.dragging)').forEach(o=>{const before=document.createElement('div');before.className='dropzone';before.textContent='INSERISCI QUI';before.dataset.mode='before';o.before(before);if(!o.classList.contains('collapsed')){const inside=document.createElement('div');inside.className='dropzone inside';inside.textContent='DENTRO '+(o.querySelector(':scope>.card .name')?.textContent||'OBJECT');inside.dataset.mode='inside';inside._owner=o;o.querySelector(':scope>.children').prepend(inside)}})}
function clearZones(){document.querySelectorAll('.dropzone').forEach(z=>z.remove())}
function press(e){if(e.currentTarget.closest('.root'))return;const o=e.currentTarget.parentElement;current=o;sx=e.clientX;sy=e.clientY;armed=false;timer=setTimeout(()=>begin(o,e),180);e.currentTarget.setPointerCapture(e.pointerId);e.currentTarget.addEventListener('pointermove',move);e.currentTarget.addEventListener('pointerup',end,{once:true});e.currentTarget.addEventListener('pointercancel',end,{once:true})}
function begin(o,e){drag=o;origin=o.parentElement;armed=true;const r=o.getBoundingClientRect();dx=sx-r.left;dy=sy-r.top;o.style.left=r.left+'px';o.style.top=r.top+'px';o.classList.add('dragging');zones();navigator.vibrate?.(15)}
function move(e){if(!armed){const mx=e.clientX-sx,my=e.clientY-sy;if(mx < -45 && Math.abs(mx)>Math.abs(my)*1.3){clearTimeout(timer);timer=null;rename(current);return}if(Math.hypot(mx,my)>10){clearTimeout(timer);timer=null}return}drag.style.left=e.clientX-dx+'px';drag.style.top=e.clientY-dy+'px';document.querySelectorAll('.dropzone').forEach(z=>z.classList.remove('hot'));const z=document.elementsFromPoint(e.clientX,e.clientY).map(x=>x.closest?.('.dropzone')).find(Boolean);z?.classList.add('hot');if(e.clientY<70)window.scrollBy(0,-8);else if(e.clientY>innerHeight-70)window.scrollBy(0,8)}
function end(e){clearTimeout(timer);timer=null;const card=e.currentTarget;card.removeEventListener('pointermove',move);if(!armed){drag=null;return}const z=document.elementsFromPoint(e.clientX,e.clientY).map(x=>x.closest?.('.dropzone')).find(Boolean);drag.classList.remove('dragging');drag.style.left=drag.style.top='';if(z){if(z.dataset.mode==='inside')z._owner.querySelector(':scope>.children').append(drag);else z.before(drag)}else origin.append(drag);clearZones();drag=origin=null;armed=false}
function rename(o){if(!o)return;const layer=document.createElement('div');layer.className='rename';layer.innerHTML='<div class="rename-box"><input aria-label="Nuovo nome"></div>';const input=layer.querySelector('input'),label=o.querySelector(':scope>.card>.name');input.value=label.textContent;document.body.append(layer);setTimeout(()=>{input.focus();input.select()},0);const save=()=>{const v=input.value.trim();if(v)label.textContent=v;layer.remove();current=null};input.addEventListener('keydown',e=>{if(e.key==='Enter')save()});input.addEventListener('blur',save)}
</script></body></html>
