<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JSON Drop · Recursive Boxes</title>
<style>
:root{color-scheme:dark;--bg:#0b0c0f;--panel:#151820;--card:#20242e;--line:#596170;--text:#fff;--muted:#aeb5c1;--accent:#9db2ff;--object:#65ff8f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,sans-serif;overscroll-behavior:none}
main{max-width:620px;margin:auto;padding:18px 14px 70px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.top b{font-size:18px}.top small{display:block;color:var(--muted);margin-top:3px}
button{font:inherit;color:inherit}.add{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 15px;margin-bottom:12px}
.box{border-left:1px solid var(--line);margin:2px 0;background:transparent}
.box>.head{height:38px;display:flex;align-items:center;gap:7px;padding:0 8px;background:transparent;touch-action:none;user-select:none;-webkit-user-select:none}
.toggle{width:22px;height:22px;border:0;background:transparent;padding:0;color:var(--muted);font-size:17px}.name{flex:1;font-weight:700;color:var(--object);min-width:0;border:0;outline:0;background:transparent;padding:5px 3px;border-radius:5px}.name:focus{background:#65ff8f12;box-shadow:inset 0 0 0 1px #65ff8f55}.brace{font:700 16px ui-monospace,monospace;color:var(--muted)}
.body{min-height:8px;padding:0 0 0 20px;transition:.15s}.body.hot{background:#9db2ff12;box-shadow:inset 0 0 0 1px var(--accent)}
.close{display:none}
.box.collapsed>.body,.box.collapsed>.close{display:none}.box.dragging{position:fixed;z-index:50;width:min(440px,86vw);pointer-events:none;opacity:.94;box-shadow:0 18px 50px #000a}
.empty{height:10px;display:flex;align-items:center;color:transparent;font-size:1px;pointer-events:none}.root{margin-top:0;border:1px solid var(--line);border-radius:12px;padding:4px}.root>.head{background:transparent}.root>.head .name{letter-spacing:.03em}
.note{color:var(--muted);font-size:11px;text-align:center;margin-top:12px}
</style></head><body><main>
<div class="top"><div><b>JSON Drop</b><small>Object dentro Object</small></div></div>
<button class="add" id="add">+ Object {}</button>
<section class="box root" id="root">
 <div class="head"><button class="toggle" aria-label="Espandi o comprimi">▾</button><span class="name">ROOT</span><span class="brace">{</span></div>
 <div class="body"></div><div class="close">}</div>
</section>
<div class="note">Trascina un Object dentro un altro Object.</div>
</main><script>
const root=document.querySelector('#root');let seq=0,drag=null,origin=null,dx=0,dy=0;
function refreshEmpty(body){body.querySelector(':scope > .empty')?.remove();if(!body.querySelector(':scope > .box')){let e=document.createElement('div');e.className='empty';e.textContent='rilascia un Object qui';body.append(e)}}
function makeBox(){const b=document.createElement('section');b.className='box';b.dataset.id=++seq;b.innerHTML='<div class="head"><button class="toggle" aria-label="Espandi o comprimi">▾</button><span class="name">Object '+seq+'</span><span class="brace">{</span></div><div class="body"></div><div class="close">}</div>';const head=b.querySelector(':scope > .head'),tog=b.querySelector(':scope > .head > .toggle');b.querySelector('.name').addEventListener('pointerdown',e=>e.stopPropagation());tog.addEventListener('pointerdown',e=>e.stopPropagation());tog.addEventListener('click',()=>{b.classList.toggle('collapsed');tog.textContent=b.classList.contains('collapsed')?'▸':'▾'});head.addEventListener('pointerdown',start);refreshEmpty(b.querySelector(':scope > .body'));return b}
document.querySelector('#add').onclick=()=>{const b=makeBox(),body=root.querySelector(':scope > .body');body.append(b);refreshEmpty(body)}
function start(e){if(e.target.closest('button'))return;drag=e.currentTarget.parentElement;origin=drag.parentElement;const r=drag.getBoundingClientRect();dx=e.clientX-r.left;dy=e.clientY-r.top;drag.style.left=r.left+'px';drag.style.top=r.top+'px';drag.style.height=r.height+'px';drag.classList.add('dragging');drag.setPointerCapture(e.pointerId);drag.addEventListener('pointermove',move);drag.addEventListener('pointerup',end,{once:true});e.preventDefault()}
function targetAt(x,y){return document.elementsFromPoint(x,y).map(el=>el.closest?.('.body')).find(body=>body&&!drag.contains(body))}
function move(e){if(!drag)return;drag.style.left=e.clientX-dx+'px';drag.style.top=e.clientY-dy+'px';document.querySelectorAll('.body').forEach(x=>x.classList.remove('hot'));targetAt(e.clientX,e.clientY)?.classList.add('hot')}
function end(e){if(!drag)return;const target=targetAt(e.clientX,e.clientY);drag.classList.remove('dragging');drag.style.left=drag.style.top=drag.style.height='';drag.removeEventListener('pointermove',move);document.querySelectorAll('.body').forEach(x=>x.classList.remove('hot'));if(target){target.append(drag);refreshEmpty(target)}else origin.append(drag);refreshEmpty(origin);drag=origin=null}
refreshEmpty(root.querySelector(':scope > .body'));
</script></body></html>
