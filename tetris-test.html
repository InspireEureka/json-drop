<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>JSON Drop · Touch Tree</title>
<style>
:root{color-scheme:dark;--bg:#0b0c0f;--panel:#151820;--card:#20242e;--line:#596170;--text:#fff;--muted:#aeb5c1;--green:#65ff8f;--accent:#9db2ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,sans-serif;overscroll-behavior:none}main{max-width:620px;margin:auto;padding:18px 14px 80px}
.top b{font-size:18px}.top small{display:block;color:var(--muted);margin:3px 0 14px}.add{min-height:48px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:13px;padding:0 16px;font:inherit;margin-bottom:12px}
.object{margin:5px 0}.card{transition:transform .18s ease,background .18s ease}.object.swiping>.card{transition:none}.object.rename-ready>.card{background:#29352e}.card{height:54px;border:1px solid var(--line);border-radius:12px;background:var(--card);display:flex;align-items:center;gap:9px;padding:0 11px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.toggle{width:34px;height:44px;border:0;background:transparent;color:var(--muted);font-size:18px}.icon{width:30px;height:30px;border:1px solid var(--green);border-radius:7px;display:grid;place-items:center;color:var(--green);font:700 12px ui-monospace,monospace}.name{flex:1;min-width:0;color:var(--green);font:700 16px system-ui;padding:10px 4px}.rename{position:fixed;inset:0;background:#0009;z-index:200;display:grid;place-items:center;padding:24px}.rename-box{width:min(420px,100%);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;animation:pop .16s ease}.rename-actions{display:flex;gap:10px;margin-top:10px}.rename-actions button{flex:1;height:46px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);font-size:18px}@keyframes pop{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}.rename-box input{width:100%;height:52px;border:1px solid var(--green);border-radius:10px;background:var(--panel);color:var(--green);font:700 18px system-ui;padding:0 12px;outline:0}.brace{color:var(--muted);font:700 16px ui-monospace,monospace}
.children{margin-left:25px;padding-left:10px;border-left:1px solid #39404c;min-height:4px}.object.collapsed>.children{display:none}.root>.card{background:#252a35}.root>.children{margin-left:17px}
.object.dragging{position:fixed;z-index:100;width:min(480px,88vw);pointer-events:none;opacity:.92;filter:drop-shadow(0 16px 25px #000a)}.object.dragging>.children{display:none}
.card.drop-inside{border-color:var(--accent);background:#28304a;box-shadow:inset 0 0 0 1px var(--accent)}.placeholder{height:54px;margin:5px 0;border:1px dashed var(--accent);border-radius:12px;background:#9db2ff0b;animation:openSlot .14s ease}.children>.placeholder{margin-left:0}@keyframes openSlot{from{height:0;opacity:0;margin-top:0;margin-bottom:0}to{height:54px;opacity:1;margin-top:5px;margin-bottom:5px}}
.note{text-align:center;color:var(--muted);font-size:11px;margin-top:12px}
</style></head><body><main>
<div class="top"><b>JSON Drop</b><small>Swipe a sinistra = rinomina · tieni e trascina la card = sposta</small></div>
<button class="add" id="add">+ Object {}</button>
<section class="object root" id="root"><div class="card"><button class="toggle">▾</button><span class="icon">{}</span><span class="name">ROOT</span><span class="brace">{</span></div><div class="children"></div></section>
<div class="note">Durante il drag reagisce solo la destinazione sotto il dito.</div>
</main><script>
const root=document.querySelector('#root');let seq=0,drag=null,origin=null,timer=null,sx=0,sy=0,dx=0,dy=0,armed=false,current=null,lastX=0,lastY=0,placeholder=null,lastTarget=null;
function make(){const o=document.createElement('section');o.className='object';o.innerHTML='<div class="card"><button class="toggle">▾</button><span class="icon">{}</span><span class="name">Object '+(++seq)+'</span><span class="brace">{</span></div><div class="children"></div>';const card=o.querySelector('.card'),tog=o.querySelector('.toggle');tog.addEventListener('touchstart',e=>e.stopPropagation(),{passive:false});tog.onclick=()=>{o.classList.toggle('collapsed');tog.textContent=o.classList.contains('collapsed')?'▸':'▾'};card.addEventListener('touchstart',start,{passive:false});card.addEventListener('touchmove',move,{passive:false});card.addEventListener('touchend',end,{passive:false});card.addEventListener('touchcancel',cancel,{passive:false});return o}
document.querySelector('#add').onclick=()=>root.querySelector(':scope>.children').append(make());
function clearTarget(removeSlot=false){document.querySelectorAll('.drop-inside').forEach(x=>x.classList.remove('drop-inside'));if(removeSlot&&placeholder){placeholder.remove();placeholder=null}lastTarget=null}
function ensurePlaceholder(){if(!placeholder){placeholder=document.createElement('div');placeholder.className='placeholder'}return placeholder}
function targetAt(x,y){document.querySelectorAll('.drop-inside').forEach(x=>x.classList.remove('drop-inside'));const card=document.elementsFromPoint(x,y).map(el=>el.closest?.('.card')).find(card=>card&&!card.closest('.dragging'));if(!card){placeholder?.remove();placeholder=null;lastTarget=null;return null}const o=card.parentElement;if(o===drag||drag?.contains(o))return null;const r=card.getBoundingClientRect(),p=(y-r.top)/r.height;let mode=p<.28?'before':p>.72?'after':'inside';if(o.classList.contains('root'))mode='inside';if(mode==='inside'){placeholder?.remove();placeholder=null;card.classList.add('drop-inside')}else{const ph=ensurePlaceholder();if(mode==='before')o.before(ph);else o.after(ph)}lastTarget={o,mode};return lastTarget}
function start(e){if(e.currentTarget.parentElement.classList.contains('root'))return;if(e.touches.length!==1)return;e.preventDefault();const t=e.touches[0],o=e.currentTarget.parentElement;current=o;sx=lastX=t.clientX;sy=lastY=t.clientY;armed=false;drag=null;clearTimeout(timer);timer=setTimeout(()=>begin(o),240)}
function begin(o){if(!current||armed)return;drag=o;origin=o.parentElement;armed=true;const r=o.getBoundingClientRect();dx=sx-r.left;dy=sy-r.top;o.style.left=r.left+'px';o.style.top=r.top+'px';o.classList.add('dragging')}
function move(e){if(!current||e.touches.length!==1)return;e.preventDefault();const t=e.touches[0];lastX=t.clientX;lastY=t.clientY;const mx=lastX-sx,my=lastY-sy;if(!armed){if(mx<0&&Math.abs(mx)>Math.abs(my)){current.classList.add('swiping');current.querySelector(':scope>.card').style.transform='translateX('+Math.max(-72,mx*.65)+'px)';if(mx<-38)current.classList.add('rename-ready');else current.classList.remove('rename-ready')}if(mx<-58&&Math.abs(mx)>Math.abs(my)*1.25){clearTimeout(timer);timer=null;const o=current;current=null;o.querySelector(':scope>.card').style.transform='translateX(-72px)';setTimeout(()=>{o.querySelector(':scope>.card').style.transform='';o.classList.remove('swiping','rename-ready');rename(o)},120);return}if(Math.hypot(mx,my)>14){clearTimeout(timer);timer=null}return}drag.style.left=lastX-dx+'px';drag.style.top=lastY-dy+'px';targetAt(lastX,lastY)}
function end(e){e.preventDefault();clearTimeout(timer);timer=null;if(!armed||!drag){reset();return}const t=lastTarget||targetAt(lastX,lastY);drag.classList.remove('dragging');drag.style.left=drag.style.top='';if(t){if(t.mode==='inside'){t.o.classList.remove('collapsed');t.o.querySelector(':scope>.toggle')?.replaceChildren('▾');t.o.querySelector(':scope>.children').append(drag)}else if(placeholder)placeholder.replaceWith(drag);else if(t.mode==='before')t.o.before(drag);else t.o.after(drag)}else origin.append(drag);placeholder=null;clearTarget(true);reset()}
function cancel(){clearTimeout(timer);if(drag){drag.classList.remove('dragging');drag.style.left=drag.style.top='';origin?.append(drag)}clearTarget(true);reset()}
function reset(){if(current){current.querySelector(':scope>.card')?.style.removeProperty('transform');current.classList.remove('swiping','rename-ready')}drag=origin=current=null;armed=false}
function rename(o){if(!o)return;const layer=document.createElement('div');layer.className='rename';layer.innerHTML='<div class="rename-box"><input aria-label="Nuovo nome"><div class="rename-actions"><button class="cancel" aria-label="Annulla">×</button><button class="save" aria-label="Salva">✓</button></div></div>';const input=layer.querySelector('input'),label=o.querySelector(':scope>.card>.name');input.value=label.textContent;document.body.append(layer);setTimeout(()=>{input.focus();input.select()},0);let closed=false;const close=save=>{if(closed)return;closed=true;if(save){const v=input.value.trim();if(v)label.textContent=v}layer.remove();reset()};layer.querySelector('.save').onclick=()=>close(true);layer.querySelector('.cancel').onclick=()=>close(false);layer.addEventListener('pointerdown',e=>{if(e.target===layer)close(false)});input.addEventListener('keydown',e=>{if(e.key==='Enter')close(true);if(e.key==='Escape')close(false)})}
</script></body></html>
