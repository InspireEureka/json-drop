<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JSON Drop · Live JSON</title>
<style>
:root{
  color-scheme:dark;
  --bg:#0b0c0f;
  --panel:#151820;
  --line:#343b47;
  --text:#eef2f7;
  --muted:#8d96a5;
  --green:#65ff8f;
  --accent:#9db2ff;
  --danger:#ff7f87;
  --indent:18px;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font:15px system-ui,-apple-system,sans-serif;
  min-height:100vh;
}
main{
  max-width:720px;
  margin:auto;
  padding:18px 12px 80px;
}
.top{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:14px;
}
.top b{font-size:18px;margin-right:auto}
.top button{
  height:38px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--panel);
  color:var(--text);
  padding:0 11px;
  font:inherit;
}
.top .clear{color:var(--danger)}
.editor{
  border:1px solid #252b35;
  border-radius:14px;
  background:#0e1015;
  padding:10px 0 14px;
  overflow-x:auto;
  box-shadow:0 16px 40px #0004;
}
.line{
  min-height:34px;
  display:flex;
  align-items:center;
  gap:4px;
  padding-right:8px;
  white-space:nowrap;
  font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
.line:hover{background:#ffffff05}
.code{color:var(--muted)}
.key,.string{
  color:var(--green);
  min-width:1ch;
  border-radius:5px;
  outline:none;
}
.number{color:#9db2ff}
.boolean{color:#ffc978}
.null{color:#c49cff}
.editable{
  padding:1px 2px;
  border-bottom:1px solid transparent;
}
.editable:focus{
  background:#65ff8f0d;
  border-bottom-color:var(--green);
}
.invalid{
  color:var(--danger)!important;
  border-bottom-color:var(--danger)!important;
}
.delete{
  margin-left:auto;
  width:30px;
  height:30px;
  flex:0 0 30px;
  border:0;
  border-radius:8px;
  background:transparent;
  color:#626b78;
  font-size:20px;
  line-height:1;
}
.delete:active,.delete:hover{color:var(--danger);background:#ff7f8710}
.add-line{
  min-height:34px;
  display:flex;
  align-items:center;
  padding-right:8px;
}
.add-btn{
  border:0;
  background:transparent;
  color:#687383;
  font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  padding:7px 4px;
}
.add-btn:active,.add-btn:hover{color:var(--green)}
.type-menu{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  padding:4px 8px 8px 0;
}
.type-menu button{
  height:34px;
  border:1px solid #39414e;
  border-radius:9px;
  background:#151922;
  color:#b9c1cd;
  padding:0 10px;
  font:12px system-ui;
}
.type-menu button:active,.type-menu button:hover{
  border-color:var(--green);
  color:var(--green);
}
.hint{
  margin:12px 2px 0;
  color:var(--muted);
  font-size:12px;
  text-align:center;
}
.toast{
  position:fixed;
  left:50%;
  bottom:22px;
  transform:translateX(-50%) translateY(10px);
  background:#222832;
  border:1px solid var(--line);
  color:var(--text);
  border-radius:999px;
  padding:9px 14px;
  opacity:0;
  pointer-events:none;
  transition:.18s ease;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:520px){
  main{padding-left:8px;padding-right:8px}
  .top button{padding:0 9px;font-size:13px}
  :root{--indent:14px}
  .line{font-size:13px}
}
</style>
</head>
<body>
<main>
  <div class="top">
    <b>JSON Drop</b>
    <button id="copy">Copia</button>
    <button id="download">Scarica</button>
    <button class="clear" id="clear">Clear</button>
  </div>
  <div class="editor" id="editor" aria-label="Editor JSON visuale"></div>
  <div class="hint">Tocca testo e valori per modificarli. La sintassi resta gestita dall'app.</div>
</main>
<div class="toast" id="toast"></div>

<script>
const editor=document.querySelector('#editor');
const toast=document.querySelector('#toast');
let nextId=1;
let openAdder=null;
let focusAfterRender=null;

const node=(type,value)=>({id:nextId++,type,value});
const root={id:0,type:'object',children:[]};

function primitive(type){
  if(type==='string')return node('string','value');
  if(type==='number')return node('number','0');
  if(type==='boolean')return node('boolean','true');
  if(type==='null')return node('null',null);
  if(type==='object')return {id:nextId++,type:'object',children:[]};
  if(type==='array')return {id:nextId++,type:'array',children:[]};
}

function property(type){
  return {id:nextId++,kind:'property',key:'key',value:primitive(type)};
}

function esc(s){return JSON.stringify(String(s))}

function valueToJSON(v,depth){
  if(v.type==='string')return esc(v.value);
  if(v.type==='number')return String(v.value);
  if(v.type==='boolean')return String(v.value);
  if(v.type==='null')return 'null';

  const pad='  '.repeat(depth);
  const inner='  '.repeat(depth+1);

  if(v.type==='object'){
    if(!v.children.length)return '{}';
    return '{\\n'+v.children.map(p=>inner+esc(p.key)+': '+valueToJSON(p.value,depth+1)).join(',\\n')+'\\n'+pad+'}';
  }

  if(v.type==='array'){
    if(!v.children.length)return '[]';
    return '[\\n'+v.children.map(i=>inner+valueToJSON(i,depth+1)).join(',\\n')+'\\n'+pad+']';
  }
}

function jsonText(){
  return valueToJSON(root,0);
}

function findContainer(id,n=root){
  if(n.id===id&&(n.type==='object'||n.type==='array'))return n;
  if(n.type==='object'){
    for(const p of n.children){
      const r=findContainer(id,p.value);
      if(r)return r;
    }
  }
  if(n.type==='array'){
    for(const i of n.children){
      const r=findContainer(id,i);
      if(r)return r;
    }
  }
  return null;
}

function findProperty(id,n=root){
  if(n.type==='object'){
    for(const p of n.children){
      if(p.id===id)return p;
      const r=findProperty(id,p.value);
      if(r)return r;
    }
  }
  if(n.type==='array'){
    for(const i of n.children){
      const r=findProperty(id,i);
      if(r)return r;
    }
  }
  return null;
}

function findNode(id,n=root){
  if(n.id===id)return n;
  if(n.type==='object'){
    for(const p of n.children){
      if(p.value.id===id)return p.value;
      const r=findNode(id,p.value);
      if(r)return r;
    }
  }
  if(n.type==='array'){
    for(const i of n.children){
      if(i.id===id)return i;
      const r=findNode(id,i);
      if(r)return r;
    }
  }
  return null;
}

function removeById(id,n=root){
  if(n.type==='object'){
    const idx=n.children.findIndex(p=>p.id===id);
    if(idx>=0){n.children.splice(idx,1);return true}
    for(const p of n.children)if(removeById(id,p.value))return true;
  }
  if(n.type==='array'){
    const idx=n.children.findIndex(i=>i.id===id);
    if(idx>=0){n.children.splice(idx,1);return true}
    for(const i of n.children)if(removeById(id,i))return true;
  }
  return false;
}

function line(depth,html){
  return '<div class="line" style="padding-left:calc(10px + '+depth+' * var(--indent))">'+html+'</div>';
}

function renderPrimitive(v,depth,prefix,suffix,deleteId){
  let valueHtml='';
  if(v.type==='string'){
    valueHtml='<span class="code">&quot;</span><span class="string editable" contenteditable="true" spellcheck="false" data-edit-value="'+v.id+'">'+escapeHTML(v.value)+'</span><span class="code">&quot;</span>';
  }else if(v.type==='number'){
    valueHtml='<span class="number editable" contenteditable="true" spellcheck="false" data-edit-value="'+v.id+'">'+escapeHTML(v.value)+'</span>';
  }else if(v.type==='boolean'){
    valueHtml='<span class="boolean editable" contenteditable="true" spellcheck="false" data-edit-value="'+v.id+'">'+escapeHTML(v.value)+'</span>';
  }else{
    valueHtml='<span class="null">null</span>';
  }
  return line(depth,prefix+valueHtml+suffix+'<button class="delete" data-delete="'+deleteId+'" aria-label="Elimina">×</button>');
}

function renderValue(v,depth,prefix,suffix,deleteId){
  if(!['object','array'].includes(v.type)){
    return renderPrimitive(v,depth,prefix,suffix,deleteId);
  }

  const open=v.type==='object'?'{':'[';
  const close=v.type==='object'?'}':']';
  let html=line(depth,prefix+'<span class="code">'+open+'</span><button class="delete" data-delete="'+deleteId+'" aria-label="Elimina">×</button>');

  const children=v.children;
  children.forEach((child,index)=>{
    const comma=index<children.length-1?',':'';
    if(v.type==='object'){
      const key='<span class="code">&quot;</span><span class="key editable" contenteditable="true" spellcheck="false" data-edit-key="'+child.id+'">'+escapeHTML(child.key)+'</span><span class="code">&quot;: </span>';
      html+=renderValue(child.value,depth+1,key,comma,child.id);
    }else{
      html+=renderValue(child,depth+1,'',comma,child.id);
    }
  });

  html+=renderAdder(v,depth+1);
  html+=line(depth,'<span class="code">'+close+suffix+'</span>');
  return html;
}

function renderAdder(container,depth){
  const label=container.type==='object'?'+ Property':'+ Item';
  let html='<div class="add-line" style="padding-left:calc(10px + '+depth+' * var(--indent))"><button class="add-btn" data-add="'+container.id+'">'+label+'</button></div>';

  if(openAdder===container.id){
    html+='<div class="type-menu" style="padding-left:calc(10px + '+depth+' * var(--indent))">';
    ['string','number','boolean','null','object','array'].forEach(t=>{
      const label=t==='object'?'Object {}':t==='array'?'Array []':t[0].toUpperCase()+t.slice(1);
      html+='<button data-type="'+t+'" data-parent="'+container.id+'">'+label+'</button>';
    });
    html+='</div>';
  }
  return html;
}

function escapeHTML(s){
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render(){
  let html=line(0,'<span class="code">{</span>');
  root.children.forEach((p,index)=>{
    const comma=index<root.children.length-1?',':'';
    const key='<span class="code">&quot;</span><span class="key editable" contenteditable="true" spellcheck="false" data-edit-key="'+p.id+'">'+escapeHTML(p.key)+'</span><span class="code">&quot;: </span>';
    html+=renderValue(p.value,1,key,comma,p.id);
  });
  html+=renderAdder(root,1);
  html+=line(0,'<span class="code">}</span>');
  editor.innerHTML=html;
  bindEditor();

  if(focusAfterRender){
    const el=editor.querySelector(focusAfterRender);
    focusAfterRender=null;
    if(el){
      el.focus();
      const range=document.createRange();
      range.selectNodeContents(el);
      const sel=getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }
  }
}

function bindEditor(){
  editor.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{
    const id=Number(b.dataset.add);
    openAdder=openAdder===id?null:id;
    render();
  });

  editor.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{
    const parent=findContainer(Number(b.dataset.parent));
    if(!parent)return;

    if(parent.type==='object'){
      const p=property(b.dataset.type);
      parent.children.push(p);
      focusAfterRender='[data-edit-key="'+p.id+'"]';
    }else{
      const v=primitive(b.dataset.type);
      parent.children.push(v);
      if(['string','number','boolean'].includes(v.type)){
        focusAfterRender='[data-edit-value="'+v.id+'"]';
      }
    }

    openAdder=null;
    render();
  });

  editor.querySelectorAll('[data-delete]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    removeById(Number(b.dataset.delete));
    render();
  });

  editor.querySelectorAll('[data-edit-key]').forEach(el=>{
    const p=findProperty(Number(el.dataset.editKey));
    if(!p)return;
    const old=p.key;

    const commitKey=()=>{
      const v=el.textContent.trim();
      p.key=v||old;
      if(!v){render();return false}
      return true;
    };

    el.onkeydown=e=>{
      if(e.key==='Enter'){
        e.preventDefault();
        if(!commitKey())return;
        if(['string','number','boolean'].includes(p.value.type)){
          const next=editor.querySelector('[data-edit-value="'+p.value.id+'"]');
          if(next){
            next.focus();
            const range=document.createRange();
            range.selectNodeContents(next);
            const sel=getSelection();
            sel.removeAllRanges();
            sel.addRange(range);
          }
        }else{
          el.blur();
        }
      }
      if(e.key==='Escape'){e.preventDefault();el.textContent=old;el.blur()}
    };

    el.onblur=()=>{commitKey()};
  });

  editor.querySelectorAll('[data-edit-value]').forEach(el=>{
    const v=findNode(Number(el.dataset.editValue));
    if(!v)return;
    const old=v.value;

    el.onkeydown=e=>{
      if(e.key==='Enter'){e.preventDefault();el.blur()}
      if(e.key==='Escape'){e.preventDefault();el.textContent=old;el.blur()}
    };

    el.oninput=()=>{
      if(v.type==='number'){
        el.classList.toggle('invalid',!validNumber(el.textContent));
      }else if(v.type==='boolean'){
        const t=el.textContent.trim();
        el.classList.toggle('invalid',t!=='true'&&t!=='false');
      }
    };

    el.onblur=()=>{
      const raw=el.textContent;
      if(v.type==='string'){
        v.value=raw;
        return;
      }
      if(v.type==='number'){
        const t=raw.trim();
        if(validNumber(t))v.value=t;
        else{v.value=old;render()}
        return;
      }
      if(v.type==='boolean'){
        const t=raw.trim();
        if(t==='true'||t==='false')v.value=t;
        else{v.value=old;render()}
      }
    };
  });
}

function validNumber(s){
  return /^-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+-]?\d+)?$/.test(String(s).trim());
}

function flash(msg){
  toast.textContent=msg;
  toast.classList.add('show');
  clearTimeout(flash.t);
  flash.t=setTimeout(()=>toast.classList.remove('show'),1200);
}

document.querySelector('#clear').onclick=()=>{
  root.children.length=0;
  openAdder=null;
  render();
  flash('ROOT svuotato');
};

document.querySelector('#copy').onclick=async()=>{
  const text=jsonText();
  try{
    await navigator.clipboard.writeText(text);
  }catch{
    const ta=document.createElement('textarea');
    ta.value=text;
    document.body.append(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
  }
  flash('JSON copiato');
};

document.querySelector('#download').onclick=()=>{
  const blob=new Blob([jsonText()+'\\n'],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='data.json';
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
};

render();
</script>
</body>
</html>
